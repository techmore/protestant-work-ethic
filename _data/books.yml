# Each book links to an Amazon search for `q`. Set `url` to override (e.g. for papers).
- group: "Primary sources"
  books:
    - { author: "Max Weber", title: "The Protestant Ethic and the Spirit of Capitalism", year: "1905 / 1920", q: "Weber The Protestant Ethic and the Spirit of Capitalism", tag: "Start here", why: "Shorter than its reputation suggests, and the actual argument about the calling, predestination, and the iron cage is subtler than any summary." }
    - { author: "Max Weber", title: "From Max Weber: Essays in Sociology", year: "1946 ed.", q: "From Max Weber Essays in Sociology Gerth Mills", why: "Contains both “Science as a Vocation” (disenchantment, the old gods rising) and “Politics as a Vocation” (the ethic of responsibility)." }
    - { author: "Benjamin Franklin", title: "Autobiography", year: "1771–90", q: "Benjamin Franklin Autobiography", why: "The secularized ethic in its own cheerful voice, virtue chart included. Read it next to Weber’s chapter 2." }
    - { author: "Richard Baxter", title: "A Christian Directory", year: "1673", q: "Richard Baxter A Christian Directory", why: "The Puritan pastor Weber leaned on most. Skim the sections on calling and time to hear the original pressure firsthand." }
    - { author: "Friedrich Nietzsche", title: "The Gay Science", year: "1882", q: "Nietzsche The Gay Science Kaufmann", why: "Read §125, “The Madman,” and §343 for the clearest statement of what “God is dead” actually means." }
    - { author: "Friedrich Nietzsche", title: "Twilight of the Idols", year: "1889", q: "Nietzsche Twilight of the Idols", why: "Includes the George Eliot passage: drop the faith and you pull the morality out from under your own feet." }
    - { author: "Ayn Rand", title: "Atlas Shrugged", year: "1957", q: "Atlas Shrugged Ayn Rand", why: "The heroic, atheist version of the productive ethic, worth reading as a primary source to see exactly where it departs from the Puritans." }

- group: "The debate over Weber"
  books:
    - { author: "R. H. Tawney", title: "Religion and the Rise of Capitalism", year: "1926", q: "Tawney Religion and the Rise of Capitalism", why: "The classic sympathetic critique, showing religion and commerce reshaping each other over two centuries." }
    - { author: "Becker & Woessmann", title: "“Was Weber Wrong?”", year: "2009", essay: true, url: "https://scholar.google.com/scholar?q=Was+Weber+Wrong+A+Human+Capital+Theory+of+Protestant+Economic+History", why: "A readable economics paper that keeps the Protestant advantage but explains it through literacy. (Links to Google Scholar.)" }
    - { author: "Deirdre McCloskey", title: "Bourgeois Dignity", year: "2010", q: "McCloskey Bourgeois Dignity", why: "An energetic argument that what changed was how society talked about and respected commerce, not theology or institutions." }
    - { author: "Joseph Henrich", title: "The WEIRDest People in the World", year: "2020", q: "Henrich The WEIRDest People in the World", why: "A sweeping, data-heavy account of how Western psychology became individualistic, starting centuries before Luther." }

- group: "Secularization"
  books:
    - { author: "Tom Holland", title: "Dominion", year: "2019", q: "Tom Holland Dominion", why: "The most readable book on this list, arguing that even secular Western values are Christian at the root." }
    - { author: "Charles Taylor", title: "A Secular Age", year: "2007", q: "Charles Taylor A Secular Age", why: "The definitive account of how belief went from unavoidable to optional. Very long, so dip in by chapter." }
    - { author: "Émile Durkheim", title: "The Elementary Forms of Religious Life", year: "1912", q: "Durkheim The Elementary Forms of Religious Life", why: "The foundational argument that societies generate the sacred, which is why it doesn’t disappear when belief does." }
    - { author: "John Gray", title: "Seven Types of Atheism", year: "2018", q: "John Gray Seven Types of Atheism", why: "A short, sharp tour of how many forms of unbelief quietly carry Christian hopes forward." }

- group: "Substitutes and new ethics"
  books:
    - { author: "Paul Tillich", title: "Dynamics of Faith", year: "1957", q: "Tillich Dynamics of Faith", why: "A short book that defines faith as “ultimate concern” and idolatry as treating something finite as ultimate." }
    - { author: "Eric Voegelin", title: "The New Science of Politics", year: "1952", q: "Voegelin The New Science of Politics", why: "The dense but precise case that modern ideologies try to bring salvation into history." }
    - { author: "Philip Rieff", title: "The Triumph of the Therapeutic", year: "1966", q: "Rieff The Triumph of the Therapeutic", why: "A strange, prophetic book on the shift from cultures of renunciation to cultures of personal well-being." }
    - { author: "Daniel Bell", title: "The Cultural Contradictions of Capitalism", year: "1976", q: "Daniel Bell The Cultural Contradictions of Capitalism", why: "Argues capitalism eats its own Protestant foundations by producing a consumer culture that rewards gratification over discipline." }
    - { author: "Tara Isabella Burton", title: "Strange Rites", year: "2020", q: "Tara Isabella Burton Strange Rites", why: "A field guide to the spiritual lives of the religiously unaffiliated, from wellness to fandom to politics." }

- group: "Fracture: where you are"
  books:
    - { author: "Alasdair MacIntyre", title: "After Virtue", year: "1981", q: "MacIntyre After Virtue", why: "Explains why modern moral arguments never end: we’re using fragments of traditions whose foundations are gone." }
    - { author: "Jonathan Haidt", title: "The Righteous Mind", year: "2012", q: "Haidt The Righteous Mind", why: "The psychology of why morality binds groups together and blinds them to each other." }
    - { author: "Byung-Chul Han", title: "The Burnout Society", year: "2010", q: "Byung-Chul Han The Burnout Society", why: "A short book on the achievement-subject who exploits themselves, Weber’s iron cage with the bars moved inward." }
    - { author: "Christopher Lasch", title: "The Culture of Narcissism", year: "1979", q: "Lasch The Culture of Narcissism", why: "What happens to the self when older disciplines, the work ethic included, lose their authority." }
    - { author: "Robert Bellah et al.", title: "Habits of the Heart", year: "1985", q: "Bellah Habits of the Heart", why: "Interviews with Americans struggling to explain their commitments in anything but the language of individual choice." }
    - { author: "Robert Putnam", title: "Bowling Alone", year: "2000", q: "Putnam Bowling Alone", why: "The data on the decline of American civic and religious participation, and what it did to social trust." }

- group: "Ways through: what comes next"
  books:
    - { author: "Paul Tillich", title: "The Shaking of the Foundations", year: "1948", q: "Tillich The Shaking of the Foundations", tag: "Part III", why: "Sermons, including “You Are Accepted,” the most direct answer on this list to the search for signs." }
    - { author: "Viktor Frankl", title: "Man’s Search for Meaning", year: "1946", q: "Man's Search for Meaning Viktor Frankl", why: "Meaning found in work, love, and the stance you take toward suffering, from someone who tested it in Auschwitz." }
    - { author: "Josef Pieper", title: "Leisure: The Basis of Culture", year: "1948", q: "Josef Pieper Leisure The Basis of Culture", why: "A short, direct challenge to “total work” and the idea that every hour must justify itself." }
    - { author: "Abraham Joshua Heschel", title: "The Sabbath", year: "1951", q: "Heschel The Sabbath", why: "A beautiful little book about holiness in time and a weekly refusal to be defined by production." }
    - { author: "Albert Camus", title: "The Rebel", year: "1951", q: "Camus The Rebel", why: "An unbeliever’s case against revolutions that kill for paradise, and for rebellion that keeps its limits." }
    - { author: "Aleksandr Solzhenitsyn", title: "The Gulag Archipelago (abridged)", year: "1973", q: "Gulag Archipelago abridged Solzhenitsyn", why: "Where the line through every human heart comes from, written against a regime certain it was on history’s side." }
    - { author: "Václav Havel", title: "The Power of the Powerless", year: "1978", q: "Havel The Power of the Powerless", why: "The greengrocer and his sign: how refusing small lies in your own sphere becomes a form of freedom." }
    - { author: "Hannah Arendt", title: "The Human Condition", year: "1958", q: "Hannah Arendt The Human Condition", why: "On labor, work, and action, and on forgiveness as the faculty that lets people begin again." }
    - { author: "Iris Murdoch", title: "The Sovereignty of Good", year: "1970", q: "Iris Murdoch The Sovereignty of Good", why: "Three short essays on attention and “unselfing”: morality as learning to see others truly." }
    - { author: "Jonathan Sacks", title: "Morality: Restoring the Common Good in Divided Times", year: "2020", q: "Jonathan Sacks Morality Restoring the Common Good", why: "A rabbi’s humane case for moving from “I” back to “we” without coercion." }
    - { author: "Yuval Levin", title: "A Time to Build", year: "2020", q: "Yuval Levin A Time to Build", why: "Why institutions that form people, rather than platforms for performing, are where trust gets rebuilt." }

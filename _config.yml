title: The Afterlife of a Calling
subtitle: Work, worth, and the search for signs from Calvin to the present
description: An essay tracing the Puritan "practical syllogism" — the inference from a fruitful life to assurance of salvation — across five centuries, and arguing that its modern residue is a search for signs with no one left to grant the verdict.
author: techmore
version: "1.0"
version_date: November 2026
